[project]
name = "sequenceguider"
version = "0.1.0"
description = "Tango sequence coach — split a practice video into its figures and explain what to watch for in each"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "opencv-contrib-python>=5.0",
    "av>=14.0",
    "mediapipe>=0.10.14",
]

[project.scripts]
sequenceguider = "sequenceguider.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sequenceguider"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
